<!doctype html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        
        <script src="../vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <link href="../vendor/node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <link rel="stylesheet" href="../vendor/node_modules/bootstrap-icons/font/bootstrap-icons.css">
        
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>

    <body class="bg-body vh-100 overflow-hidden d-flex flex-column">

        <div class="pywebview-drag-region w-100" style="height: 40px; flex-shrink: 0; position: relative;">
            
            <button id="btn-theme-toggle" class="btn btn-outline-secondary position-absolute top-50 start-0 translate-middle-y ms-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 30px; height: 30px; z-index: 1050; -webkit-app-region: no-drag; cursor: pointer;">
                <i id="theme-icon" class="bi bi-moon-fill" style="font-size: 0.9rem;"></i>
            </button>

            <button id="btn-close-app" class="btn btn-danger position-absolute top-50 end-0 translate-middle-y me-3 rounded-circle shadow d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; z-index: 1050; -webkit-app-region: no-drag; cursor: pointer;">
                <span style="font-size: 0.8rem;">✖</span>
            </button>

        </div>
        
        <div class="row m-0 flex-grow-1 overflow-hidden w-100 pb-3">
            
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center h-100 p-2">
                <div class="card shadow p-4 w-100 bg-body-tertiary border-0" style="max-width: 380px;">
                    
                    <div class="bg-body border text-body text-end p-3 rounded mb-3 text-break d-flex flex-column justify-content-center shadow-sm" style="min-height: 80px;">
                        <span id="historyScreen" class="text-body-secondary mb-1" style="font-size: 0.9rem; min-height: 20px;"></span>
                        <span id="displayScreen" class="fs-2 fw-bold"></span>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6"><button id="btn-clear" class="btn btn-danger w-100 fw-bold py-1">Limpar (C)</button></div>
                        <div class="col-6"><button id="btn-delete" class="btn btn-outline-danger w-100 fw-bold py-1">Apagar ⌫</button></div>
                    </div>

                    <div class="row g-1 mb-2">
                        <div class="col-4"><button id="btn-7" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">7</button></div>
                        <div class="col-4"><button id="btn-8" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">8</button></div>
                        <div class="col-4"><button id="btn-9" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">9</button></div>
                        
                        <div class="col-4"><button id="btn-4" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">4</button></div>
                        <div class="col-4"><button id="btn-5" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">5</button></div>
                        <div class="col-4"><button id="btn-6" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">6</button></div>
                        
                        <div class="col-4"><button id="btn-1" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">1</button></div>
                        <div class="col-4"><button id="btn-2" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">2</button></div>
                        <div class="col-4"><button id="btn-3" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">3</button></div>
                        
                        <div class="col-8"><button id="btn-0" class="btn btn-light w-100 fs-5 border fw-bold num-btn py-1">0</button></div>
                        <div class="col-4"><button id="btn-equal" class="btn btn-success w-100 fs-5 border fw-bold py-1">=</button></div>
                    </div>

                    <hr class="my-2 text-secondary">

                    <div class="row g-1">
                        <div class="col-6"><button id="sum" class="btn btn-primary w-100 fw-bold fs-5 py-1">+</button></div>
                        <div class="col-6"><button id="sub" class="btn btn-primary w-100 fw-bold fs-5 py-1">-</button></div>
                        
                        <div class="col-6"><button id="mult" class="btn btn-primary w-100 fw-bold fs-5 py-1">×</button></div>
                        <div class="col-6"><button id="div" class="btn btn-primary w-100 fw-bold fs-5 py-1">÷</button></div>
                        
                        <div class="col-12"><button id="modl" class="btn btn-secondary w-100 fw-bold fs-5 py-1">%</button></div>
                        
                        <div class="col-4"><button id="rootOf" class="btn btn-warning w-100 fw-bold text-dark py-1 fs-6">√</button></div>
                        <div class="col-4"><button id="potTwo" class="btn btn-warning w-100 fw-bold text-dark py-1 fs-6">x²</button></div>
                        <div class="col-4"><button id="potGeneral" class="btn btn-warning w-100 fw-bold text-dark py-1 fs-6">xʸ</button></div>
                    </div>

                </div>
            </div>

            <div class="col-12 col-md-6 bg-body border-start d-flex flex-column align-items-center justify-content-center h-100 p-4">
                <div class="w-100 h-100 d-flex flex-column" style="max-width: 500px;">
                    <h3 class="mb-3 text-center text-body fw-bold fs-4">Histórico de Cálculos</h3>
                    
                    <div id="historyLogArea" class="flex-grow-1 overflow-auto bg-body-tertiary border rounded p-3 mb-3 shadow-inner">
                        <p id="emptyHistoryMsg" class="text-body-secondary text-center mt-3">Nenhum cálculo realizado ainda.</p>
                    </div>

                    <button id="btn-clear-history" class="btn btn-outline-secondary w-100 fw-bold py-2">Limpar Histórico</button>
                </div>
            </div>

        </div>

        <script src="../vendor/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/index.js"></script>
    </body>
</html>
